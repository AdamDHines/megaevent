[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megaevent"
version = "1.0.0"
description = "Event-based visual place recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<2.8", "torchvision>=0.22,<0.23", "numpy>=1.26,<3", "pillow>=10", "eventcv>=1.0.7", "huggingface-hub>=0.30,<2", "pyyaml>=6", "loguru>=0.7"]

[project.optional-dependencies]
train = ["pandas>=2,<3", "pytorch-metric-learning>=2.8,<3", "safetensors>=0.5"]
logging = ["tensorboard>=2", "wandb>=0.19"]
dev = ["pytest>=8", "h5py>=3", "ruff>=0.11"]

[project.scripts]
megaevent = "megaevent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megaevent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/megaevent/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
