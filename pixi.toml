[workspace]
authors = ["Adam Hines <adam.hines@qut.edu.au>"]
channels = ["conda-forge"]
name = "megaevent"
platforms = [
    {platform = "linux-64", cuda = "12", glibc = "2.35"}
    ]
version = "0.1.0"

[tasks]
eval = {cmd = "pixi run python3 main.py"}

[target.linux-64.dependencies]
pytorch = ">=2.12.1,<3"
torchvision = ">=0.28.0,<0.29"
timm = ">=1.0.27,<2"
einops = ">=0.8.2,<0.9"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
scikit-learn = ">=1.9.0,<2"
pillow = ">=12.3.0,<13"
tqdm = ">=4.68.4,<5"
pyyaml = ">=6.0.3,<7"
tensorboard = ">=2.20.0,<3"
h5py = ">=3.16.0,<4"
hdf5plugin = ">=7.0.0,<8"
pytorch-metric-learning = ">=2.9.0,<3"
faiss-gpu = ">=1.10.0,<2"
mkl = ">=2026.1.0,<2027"
wandb = ">=0.28.0,<0.29"
scikit-image = ">=0.26.0,<0.27"
matplotlib = ">=3.11.0,<4"
# cv2.findHomography(USAC_FAST) — Event-GeM's keypoint re-ranker
opencv = ">=4.12,<6"
loguru = ">=0.7.3,<0.8"
pynmea2 = ">=1.19.0,<2"
cuda-version = "12.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cudnn = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cusparselt = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"

[pypi-dependencies]
eventcv = {path = "/home/adam/repo/eventcv", editable = true}