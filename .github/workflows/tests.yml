name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.76.2
          environments: dev
          locked: true
      - run: pixi run -e dev test
      - run: pixi run -e dev megaevent --help
      - run: pixi run -e dev megaevent train --smoke --device cpu
