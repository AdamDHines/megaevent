name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # GitHub runners have no NVIDIA driver; satisfy the cuda=12 platform requirement
      CONDA_OVERRIDE_CUDA: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.76.2
          environments: default
          locked: true
      - run: pixi run test
      - run: pixi run megaevent --help
      - run: pixi run megaevent train --smoke --device cpu
